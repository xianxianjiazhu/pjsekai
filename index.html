<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>世界計畫 小工具中心</title>
<style>
  :root{ --border:#e5e7eb; --accent:#4f46e5; --bg:#f6f7fb; }
  *{box-sizing:border-box}
  html, body { height:100%; }
  body{margin:0;font-family:ui-sans-serif,system-ui,"Noto Sans TC";background:var(--bg)}
  .wrap{max-width:880px;margin:24px auto;padding:12px; min-height:100vh;}
  .tabs{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
  .tab{
    border:1px solid var(--border); background:#fff; padding:10px 14px; border-radius:10px; cursor:pointer; font-weight:600;
  }
  .tab.active{background:var(--accent);color:#fff;border-color:transparent}
  .panel{display:none}
  .panel.active{display:block}
  iframe{
    width:100%;
    border:1px solid var(--border);
    border-radius:16px;
    background:#fff;
    height: calc(100vh - 120px);
    min-height: calc(100vh - 120px);
  }
  #frame4{
    min-height: 0;
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="tabs">
      <button class="tab active" data-target="p4">分數線預測</button>
      <button class="tab" data-target="p1">徽章目標與體力試算</button>
      <button class="tab" data-target="p2">體力回復試算</button>
      <button class="tab" data-target="p3">倍率計算</button>
      <button class="tab" data-target="p5">同角色歷史分析</button>
    </div>
    <div id="p4" class="panel active">
      <iframe id="frame4" src="score_predict.html" title="分數線預測"></iframe>
    </div>
    <div id="p1" class="panel">
      <iframe id="frame1" src="badge_calc.html" title="徽章試算"></iframe>
    </div>
    <div id="p2" class="panel">
      <iframe id="frame2" src="stamina_timer.html" title="體力回復"></iframe>
    </div>
    <div id="p3" class="panel">
      <iframe id="frame3" src="multiplier.html" title="倍率計算"></iframe>
    </div>
    <div id="p5" class="panel">
      <iframe id="frame5" src="character_analysis.html" title="同角色歷史分析"></iframe>
    </div>
  </div>
<script>
  const tabs=[...document.querySelectorAll('.tab')];
  const panels=[...document.querySelectorAll('.panel')];
  tabs.forEach(btn=>{
    btn.addEventListener('click', ()=>{
      tabs.forEach(b=>b.classList.remove('active'));
      panels.forEach(p=>p.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById(btn.dataset.target).classList.add('active');
      autoResize();
    });
  });
  function fitFrame(iframe){
    try{
      const doc = iframe.contentWindow?.document;
      if (!doc) return;
      const h = Math.max(
        doc.documentElement.scrollHeight,
        doc.body.scrollHeight,
        doc.documentElement.offsetHeight,
        doc.body.offsetHeight
      );
      if (h) {
        const minH = Math.max(window.innerHeight - 120, 0);
        iframe.style.height = Math.max(h+20, minH) + 'px';
      }
    }catch(e){
      // 不同源就保持 CSS 的 min-height
    }
  }
  function autoResize(){
    fitFrame(document.getElementById('frame1'));
    fitFrame(document.getElementById('frame2'));
    fitFrame(document.getElementById('frame3'));
    fitFrame(document.getElementById('frame5'));
    // frame4（分數線預測）改用子頁面主動回報高度（postMessage），這裡不要碰
  }
  window.addEventListener('load', ()=>{
    autoResize();
    let count = 0;
    const t = setInterval(()=>{ autoResize(); if(++count>10) clearInterval(t); }, 300);
  });
  window.addEventListener('resize', autoResize);

  window.addEventListener('message', (e)=>{
    if(!e.data || e.data.type !== 'iframe-resize') return;
    const frames = [document.getElementById('frame1'), document.getElementById('frame2'), document.getElementById('frame3'), document.getElementById('frame4'), document.getElementById('frame5')];
    frames.forEach(f=>{
      if(f && f.contentWindow === e.source){
        const newHeight = f.id === 'frame4'
          ? (e.data.height + 20)
          : Math.max(e.data.height + 20, Math.max(window.innerHeight - 120, 0));
        const currentHeight = parseFloat(f.style.height) || 0;
        if(Math.abs(newHeight - currentHeight) < 5) return;
        f.style.height = newHeight + 'px';
      }
    });
  });
</script>
</body>
</html>
